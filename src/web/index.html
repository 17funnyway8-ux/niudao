<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 走飞牛统一网关时是 /app/niudao/，直连开发时是 /；由服务端在发送时替换 -->
    <base href="__BASE__" />
    <title>牛刀 · fnOS Benchmark · 飞牛性能天梯</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.svg" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <!-- 与应用图标同一套造型：双峰折线 + 右上圆点（圆点是"尖峰"的标记，之前漏了） -->
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M7.5 22.5 12 12.5l3.4 6 2.8-4.2 4.6 8.2"
                fill="none" stroke="currentColor" stroke-width="2.6"
                stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="24.6" cy="9.4" r="2.6" fill="currentColor"/>
        </svg>
        <div class="brand-text">
          <strong>牛刀</strong>
          <span class="brand-sub">fnOS Benchmark</span>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button data-view="home" class="tab is-active" aria-label="体检">体检</button>
        <button data-view="board" class="tab">天梯</button>
        <button data-view="history" class="tab">成绩单</button>
        <button data-view="settings" class="tab">设置</button>
      </nav>
      <button class="icon-btn" id="theme-toggle" title="切换明暗主题" aria-label="切换明暗主题">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="machine-chip" id="machine-chip" title="本机硬件">
        <span class="dot"></span>
        <span id="machine-label"></span>
      </div>
    </header>

    <main id="app" class="app"></main>

    <div class="toast-wrap" id="toasts"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
