<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>牛刀天梯 · fnOS 性能排行</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f3; --panel: #fff; --ink: #17181a; --muted: #5c636d; --faint: #8b9099;
        --line: #d9d9d2; --line-soft: #e9e9e2; --accent: #1f5a94;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17181a; --panel: #1d1f22; --ink: #e6e6e3; --muted: #9ca1a8; --faint: #727880;
          --line: #33363b; --line-soft: #26292d; --accent: #7fb0dc;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.55 var(--sans); }
      .wrap { max-width: 940px; margin: 0 auto; padding: 28px 20px 64px; }
      header { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
      h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
      .sub { color: var(--faint); font-size: 12px; }
      .bar { display: flex; gap: 4px; align-items: center; margin: 14px 0; flex-wrap: wrap; }
      button, select {
        background: var(--panel); color: var(--ink); border: 1px solid var(--line);
        border-radius: 3px; padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer;
      }
      button.on { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 600; }
      table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      th {
        text-align: left; font-weight: 500; font-size: 10.5px; letter-spacing: .1em;
        text-transform: uppercase; color: var(--faint); padding: 6px 8px;
        border-bottom: 1px solid var(--line); white-space: nowrap;
      }
      td { padding: 7px 8px; border-bottom: 1px solid var(--line-soft); }
      td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
      .rank { font-family: var(--mono); color: var(--faint); width: 44px; }
      .rank.top { color: var(--ink); font-weight: 600; }
      .cpu { color: var(--faint); font-size: 11.5px; }
      .empty { color: var(--faint); text-align: center; padding: 40px 0; }
      .foot { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11.5px; line-height: 1.8; }
      .tag { border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; font-size: 10.5px; color: var(--muted); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>牛刀天梯</h1>
        <span class="sub" id="meta">载入中…</span>
      </header>

      <div class="bar">
        <button data-dim="overall" class="on">综合</button>
        <button data-dim="cpu">CPU</button>
        <button data-dim="memory">内存</button>
        <button data-dim="storage">存储</button>
        <select id="arch" aria-label="架构">
          <option value="">全部架构</option>
          <option value="x64">x86_64</option>
          <option value="arm64">ARM64</option>
        </select>
        <button id="refresh">刷新</button>
      </div>

      <table>
        <thead><tr><th class="rank">#</th><th>机器</th><th class="n">分数</th><th class="n">综合</th></tr></thead>
        <tbody id="rows"><tr><td colspan="4" class="empty">载入中…</td></tr></tbody>
      </table>

      <div class="foot" id="foot">
        分数由服务端依据原始指标重算，客户端无法直接提交分数；同一台机器（硬件指纹）只保留最好成绩；跨套件版本不混榜。
        样本不足 30 台时不显示百分位。<br />
        想上榜：在飞牛 fnOS 安装「牛刀」，设置里填入本服务地址，跑一次体检即可。
      </div>
    </div>

    <script>
      const state = { dim: "overall", arch: "" };
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const num = (n) => (typeof n === "number" && isFinite(n) ? n.toLocaleString("zh-CN") : "—");

      async function load() {
        const q = new URLSearchParams({ dim: state.dim, limit: "100" });
        if (state.arch) q.set("arch", state.arch);
        const rows = document.getElementById("rows");
        try {
          const res = await fetch(`/api/v1/leaderboard?${q}`);
          const data = await res.json();
          const stats = data.stats || {};
          document.getElementById("meta").textContent =
            `${num(data.total)} 台机器 · 套件 v${data.suite || "-"}` + (stats.gated ? ` · 样本不足 ${num(stats.n)}/30` : "");
          if (!data.entries?.length) {
            rows.innerHTML = `<tr><td colspan="4" class="empty">榜上还没有机器。</td></tr>`;
            return;
          }
          rows.innerHTML = data.entries
            .map(
              (e) => `<tr>
                <td class="rank ${e.rank <= 3 ? "top" : ""}">${e.rank}</td>
                <td>
                  <div>${esc(e.alias || e.hardware?.cpu_model || "匿名机器")}</div>
                  <div class="cpu">${esc(e.hardware?.cpu_model || "")}${e.hardware?.mem_gb ? " · " + e.hardware.mem_gb + "GB" : ""} <span class="tag">${esc(e.arch)}</span></div>
                </td>
                <td class="n">${num(e.value)}</td>
                <td class="n" style="color:var(--faint)">${num(e.composite)}</td>
              </tr>`,
            )
            .join("");
        } catch (err) {
          rows.innerHTML = `<tr><td colspan="4" class="empty">加载失败：${esc(err.message)}</td></tr>`;
        }
      }

      document.querySelectorAll("[data-dim]").forEach((b) =>
        b.addEventListener("click", () => {
          state.dim = b.dataset.dim;
          document.querySelectorAll("[data-dim]").forEach((x) => x.classList.toggle("on", x === b));
          load();
        }),
      );
      document.getElementById("arch").addEventListener("change", (e) => { state.arch = e.target.value; load(); });
      document.getElementById("refresh").addEventListener("click", load);
      load();
    </script>
  </body>
</html>
